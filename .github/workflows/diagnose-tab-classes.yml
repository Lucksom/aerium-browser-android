      name: Fetch and inspect LayoutManagerChromePhone in M153
        working-directory: chromium-src
        run: |
          set +e
          # 1. Add layout manager directories to sparse checkout
          git sparse-checkout add \
            chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts \
            chrome/android/java/src/org/chromium/chrome/browser/hub \
            ui/android/java/src/org/chromium/ui/interpolators \
            components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/animation
          git checkout "$VERSION"

          echo "=========================================================="
          echo "### 1. Locate Interpolators in M153 ###"
          find . -name "Interpolators.java" 2>/dev/null

          echo
          echo "=========================================================="
          echo "### 2. Inspect Tab Switcher Layout Creation in LayoutManagerChromePhone ###"
          LM="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutManagerChromePhone.java"
          if [ -f "$LM" ]; then
            echo "--- Matching layout initialization lines ---"
            grep -n -C 5 "createLayout\|TabSwitcherLayout\|HubLayout\|startShowing" "$LM"

            echo
            echo "--- Full Content of LayoutManagerChromePhone.java ---"
            cat "$LM"
          else
            echo "[ERROR] $LM not found, searching tree:"
            find . -name "LayoutManagerChromePhone.java"
          fi
          echo "=========================================================="
