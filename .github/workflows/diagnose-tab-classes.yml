name: Inspect Tab UI Real Sources (M153)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn || echo "153.0.8010.36")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Inspecting tag: $VERSION"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: 1. Inspect TabListCoordinator.java (layoutType, setLayoutManager, setDefaultGridCardSize)
        working-directory: chromium-src
        run: |
          set +e
          COORDINATOR=$(git ls-tree -r --name-only "$VERSION" | grep -E "tasks/tab_management/TabListCoordinator\.java$" | head -1)
          echo "===== $COORDINATOR ====="
          git show "$VERSION:$COORDINATOR" | grep -n -C 5 -E "(layoutType =|setLayoutManager|setDefaultGridCardSize)"

      - name: 2. Inspect TabListMediator.java (getSpanCount)
        working-directory: chromium-src
        run: |
          set +e
          MEDIATOR=$(git ls-tree -r --name-only "$VERSION" | grep -E "tasks/tab_management/TabListMediator\.java$" | head -1)
          echo "===== $MEDIATOR ====="
          git show "$VERSION:$MEDIATOR" | grep -n -C 5 -E "int getSpanCount"

      - name: 3. Inspect tab_management_java_sources.gni (TabListCoordinator entry)
        working-directory: chromium-src
        run: |
          set +e
          GNI=$(git ls-tree -r --name-only "$VERSION" | grep -E "tab_management_java_sources\.gni$" | head -1)
          echo "===== $GNI ====="
          git show "$VERSION:$GNI" | grep -n -C 3 "TabListCoordinator\.java"

      - name: 4. Inspect TabUiFeatureUtilities.java (end of class)
        working-directory: chromium-src
        run: |
          set +e
          UTIL=$(git ls-tree -r --name-only "$VERSION" | grep -E "tasks/tab_management/TabUiFeatureUtilities\.java$" | head -1)
          echo "===== $UTIL (tail) ====="
          git show "$VERSION:$UTIL" | tail -n 25