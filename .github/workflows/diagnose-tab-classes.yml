name: Inspect LayoutTab and Layout Symbols

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse Checkout Layouts via Git Protocol
        run: |
          set -e
          VERSION="153.0.8010.36"
          echo "Inspecting Chromium $VERSION layouts..."

          # Git upload-pack protocol is immune to Gitiles 503 web throttling
          git clone --filter=blob:none --sparse --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

          cd chromium-src
          git sparse-checkout set \
            chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts

          git checkout "$VERSION"

          echo "=========================================================="
          echo "### 1. LayoutTab.java Tilt & Border Properties ###"
          echo "=========================================================="
          LT="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/components/LayoutTab.java"
          if [ -f "$LT" ]; then
            echo "[FOUND] LayoutTab.java"
            echo "--- Tilt properties ---"
            grep -n -E "TILT_X|TILT_Y|setTilt|getTilt" "$LT" || echo "[NONE] Tilt properties missing"
            echo "--- Border properties ---"
            grep -n -E "SIDE_BORDER_SCALE|BORDER_CLOSE_BUTTON_ALPHA|BORDER_ALPHA" "$LT" || echo "[NONE] Border properties missing"
            echo "--- Close button properties ---"
            grep -n -E "CLOSE_BUTTON_WIDTH_DP|CLOSE_PLACEMENT|CLOSE_BUTTON_IS_ON_RIGHT" "$LT" || echo "[NONE] Close button properties missing"
          else
            echo "[ERROR] File not found at expected path: $LT"
          fi

          echo
          echo "=========================================================="
          echo "### 2. Layout.java createLayoutTab Method ###"
          echo "=========================================================="
          L="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/Layout.java"
          if [ -f "$L" ]; then
            echo "[FOUND] Layout.java"
            grep -n -C 4 "createLayoutTab" "$L" || echo "[NONE] createLayoutTab not found in Layout.java"
            grep -n "SHOW_CLOSE_BUTTON" "$L" || echo "[NONE] SHOW_CLOSE_BUTTON not found in Layout.java"
          else
            echo "[ERROR] File not found at expected path: $L"
          fi

          echo
          echo "=========================================================="
          echo "### 3. LayoutRenderHost.java TitleCache Method ###"
          echo "=========================================================="
          LRH="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutRenderHost.java"
          if [ -f "$LRH" ]; then
            echo "[FOUND] LayoutRenderHost.java"
            grep -n -C 3 "getTitleCache" "$LRH" || echo "[NONE] getTitleCache not in LayoutRenderHost.java"
          fi
