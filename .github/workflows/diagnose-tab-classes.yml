- name: Sparse partial clone of relevant trees
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src
          cd chromium-src
          git sparse-checkout set \
            chrome/android \
            chrome/browser/compositor \
            chrome/browser/flags \
            chrome/browser/tabmodel \
            chrome/browser/browser_controls \
            chrome/browser/tab \
            ui/android \
            components/browser_ui
          git checkout "$VERSION"

      - name: Search for tab classes
        working-directory: chromium-src
        run: |
          CLASSES=(
            TabContentManager TabModelSelectorTabModelObserver TabModelObserver
            TabModelUtils ResourceManager SceneLayer TabListSceneLayer
            CompositorAnimator FloatProperty EventFilter GestureEventFilter
            GestureHandler BrowserControlsStateProvider BrowserControlsUtils
            LayoutManager
          )
          for cls in "${CLASSES[@]}"; do
            f=$(find . -name "${cls}.java" 2>/dev/null | head -1)
            [ -n "$f" ] && echo "FOUND: $cls -> $f" || echo "NOT_FOUND: $cls"
          done