name: Probe LayoutTab and Compositor APIs in M153

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe M153 Layout and Native APIs
        run: |
          set +e
          VERSION="153.0.8010.36"
          BASE_URL="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}"

          echo "=========================================================="
          echo "### 1. PROBING LayoutTab.java SYMBOLS ###"
          echo "=========================================================="
          LAYOUT_TAB_URL="${BASE_URL}/chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/components/LayoutTab.java?format=TEXT"
          curl -sL "$LAYOUT_TAB_URL" | base64 -d > LayoutTab.java 2>/dev/null

          if [ -s LayoutTab.java ]; then
            echo "LayoutTab.java fetched successfully."
            echo "--- Checking for Tilt & 3D properties ---"
            grep -E "TILT_X|TILT_Y|setTilt|SIDE_BORDER_SCALE|BORDER_CLOSE_BUTTON_ALPHA" LayoutTab.java || echo "[MISSING] Tilt/Border properties missing from LayoutTab!"
            
            echo "--- Checking for Close Button properties ---"
            grep -E "CLOSE_BUTTON_WIDTH_DP|CLOSE_PLACEMENT|CLOSE_BUTTON_IS_ON_RIGHT" LayoutTab.java || echo "[MISSING] Close placement properties missing!"
          else
            echo "[ERROR] Failed to fetch LayoutTab.java (HTTP 404)"
          fi

          echo
          echo "=========================================================="
          echo "### 2. PROBING Layout.java FOR createLayoutTab ###"
          echo "=========================================================="
          LAYOUT_URL="${BASE_URL}/chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/Layout.java?format=TEXT"
          curl -sL "$LAYOUT_URL" | base64 -d > Layout.java 2>/dev/null

          if [ -s Layout.java ]; then
            echo "Layout.java fetched successfully."
            echo "--- Checking createLayoutTab & SHOW_CLOSE_BUTTON ---"
            grep -n -C 2 "createLayoutTab" Layout.java || echo "[MISSING] createLayoutTab() method missing from Layout.java!"
            grep -n "SHOW_CLOSE_BUTTON" Layout.java || echo "[MISSING] SHOW_CLOSE_BUTTON constant missing!"
          else
            echo "[ERROR] Failed to fetch Layout.java (HTTP 404)"
          fi

          echo
          echo "=========================================================="
          echo "### 3. PROBING LayoutRenderHost.java ###"
          echo "=========================================================="
          HOST_URL="${BASE_URL}/chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutRenderHost.java?format=TEXT"
          curl -sL "$HOST_URL" | base64 -d > LayoutRenderHost.java 2>/dev/null

          if [ -s LayoutRenderHost.java ]; then
            echo "LayoutRenderHost.java fetched successfully."
            grep -n -C 2 "getTitleCache" LayoutRenderHost.java || echo "[NOTICE] getTitleCache() not on LayoutRenderHost"
          fi

          echo
          echo "=========================================================="
          echo "### 4. PROBING NATIVE TabLayer (C++) IN M153 ###"
          echo "=========================================================="
          TAB_LAYER_H="${BASE_URL}/chrome/browser/android/compositor/layer/tab_layer.h?format=TEXT"
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$TAB_LAYER_H")
          echo "Native tab_layer.h status: HTTP $STATUS"
