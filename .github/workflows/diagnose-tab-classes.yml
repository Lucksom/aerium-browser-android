name: Inspect Scene Layer and Layout Template

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Show StaticTabSceneLayer.java in full
        working-directory: chromium-src
        run: |
          set +e
          echo "===== StaticTabSceneLayer.java ====="
          git show "$VERSION:chrome/android/java/src/org/chromium/chrome/browser/compositor/scene_layer/StaticTabSceneLayer.java"

      - name: Find and show ToolbarSwipeLayout.java (current drag+scene-layer template)
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          f=$(grep -i "ToolbarSwipeLayout.java" /tmp/all_paths.txt | head -1)
          echo "Found template file: $f"
          echo "===== $f ====="
          git show "$VERSION:$f"

      - name: Grep Layout.java for its actual scene-attachment method name
        working-directory: chromium-src
        run: |
          set +e
          git show "$VERSION:chrome/browser/ui/android/layouts/java/src/org/chromium/chrome/browser/layouts/Layout.java" \
            | grep -n -i -B2 -A6 "sceneoverlay\|getUpdatedSceneOverlayTree\|addSceneOverlay\|attachChild"
