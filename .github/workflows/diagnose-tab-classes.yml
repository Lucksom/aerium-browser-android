name: Inspect M153 APIs Part 2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Local Patches & Target Chromium APIs
        run: |
          set +e
          VERSION="153.0.8010.36"

          fetch_candidate() {
            local out_name="$1"
            shift
            local paths=("$@")

            for file_path in "${paths[@]}"; do
              local gh_url="https://raw.githubusercontent.com/chromium/chromium/${VERSION}/${file_path}"
              local status=$(curl -sL -w "%{http_code}" -o "$out_name" "$gh_url")
              if [ "$status" -eq 200 ] && [ -s "$out_name" ]; then
                echo ">>> [SUCCESS] Fetched $out_name from: $file_path"
                return 0
              fi
            done

            echo "[ERROR] Could not fetch $out_name from any candidate path"
            return 1
          }

          echo "=========================================================="
          echo "### 1. Check Local Patches for TabListCoordinator.java (newDefaultSize error) ###"
          echo "=========================================================="
          grep -rn -C 3 "classicCardHeightPx" . || echo "[NONE] classicCardHeightPx not found in repo patches"
          grep -rn -C 3 "newDefaultSize" . || echo "[NONE] newDefaultSize not found in repo patches"

          echo
          echo "=========================================================="
          echo "### 2. LayoutType.java ###"
          echo "=========================================================="
          fetch_candidate "LayoutType.java" \
            "chrome/browser/ui/android/layouts/java/src/org/chromium/chrome/browser/layouts/LayoutType.java" \
            "chrome/browser/layouts/android/java/src/org/chromium/chrome/browser/layouts/LayoutType.java" \
            "components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/LayoutType.java" \
            "chrome/android/java/src/org/chromium/chrome/browser/layouts/LayoutType.java"
          if [ -s LayoutType.java ]; then
            cat LayoutType.java
          fi

          echo
          echo "=========================================================="
          echo "### 3. Layout.java (Check Imports for LayoutType package) ###"
          echo "=========================================================="
          fetch_candidate "Layout.java" \
            "chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/Layout.java"
          if [ -s Layout.java ]; then
            grep -n "import.*LayoutType" Layout.java || echo "[NONE] LayoutType import not found"
            grep -n -C 2 "public @LayoutType int getLayoutType" Layout.java || echo "[NONE] getLayoutType not found"
          fi

          echo
          echo "=========================================================="
          echo "### 4. TabModel.java (Tab retrieval and closing methods) ###"
          echo "=========================================================="
          fetch_candidate "TabModel.java" \
            "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabModel.java"
          if [ -s TabModel.java ]; then
            echo "--- getTab methods ---"
            grep -n -E "Tab getTab|int indexOf" TabModel.java
            echo "--- closeTab / closeAllTabs methods ---"
            grep -n -E "closeTab|closeAllTabs|getTabRemover" TabModel.java
          fi

          echo
          echo "=========================================================="
          echo "### 5. TabModelSelector.java (Filter Provider & Model Index) ###"
          echo "=========================================================="
          fetch_candidate "TabModelSelector.java" \
            "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabModelSelector.java"
          if [ -s TabModelSelector.java ]; then
            grep -n -E "Filter|TabGroup|getCurrentModel" TabModelSelector.java
          fi

          echo
          echo "=========================================================="
          echo "### 6. TabThemeColorHelper.java ###"
          echo "=========================================================="
          fetch_candidate "TabThemeColorHelper.java" \
            "chrome/browser/tab/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java" \
            "chrome/android/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java" \
            "chrome/browser/ui/android/theme/java/src/org/chromium/chrome/browser/theme/TabThemeColorHelper.java" \
            "chrome/browser/android/tab/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java"
          if [ -s TabThemeColorHelper.java ]; then
            grep -n -C 3 "getBackgroundColor" TabThemeColorHelper.java
          fi

          echo
          echo "=========================================================="
          echo "### 7. HomepageManager.java (shouldCloseAppWithZeroTabs) ###"
          echo "=========================================================="
          fetch_candidate "HomepageManager.java" \
            "chrome/browser/homepage/android/java/src/org/chromium/chrome/browser/homepage/HomepageManager.java" \
            "chrome/android/java/src/org/chromium/chrome/browser/homepage/HomepageManager.java" \
            "chrome/browser/ui/android/toolbar/java/src/org/chromium/chrome/browser/toolbar/top/HomepageManager.java"
          if [ -s HomepageManager.java ]; then
            grep -n -C 3 "shouldCloseAppWithZeroTabs" HomepageManager.java
          fi
