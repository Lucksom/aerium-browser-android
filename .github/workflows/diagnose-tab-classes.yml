name: Fetch Chromium Data and Probe Symbols

on:
  workflow_dispatch:
    inputs:
      custom_file_path:
        description: 'Optional file path to fetch from Chromium src (leave empty to skip)'
        required: false
        default: ''

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium Version
        run: |
          VERSION="153.0.8010.36"
          ARGS_FILE=$(find . -name "args.gn" 2>/dev/null | head -n 1)
          if [ -n "$ARGS_FILE" ] && [ -f "$ARGS_FILE" ]; then
            DETECTED=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' "$ARGS_FILE" || true)
            [ -n "$DETECTED" ] && VERSION="$DETECTED"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target Version: $VERSION"

      - name: Probe Interpolators.java Location
        run: |
          set +e
          echo "=========================================================="
          echo "### Checking Interpolators.java Location ###"
          echo "=========================================================="
          
          CANDIDATES=(
            "ui/android/java/src/org/chromium/ui/interpolators/Interpolators.java"
            "components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/animation/Interpolators.java"
            "third_party/android_deps/libs/androidx_interpolator_interpolator/..."
          )

          for path in "${CANDIDATES[@]}"; do
            URL="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${path}?format=TEXT"
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            echo "HTTP $CODE -> $path"
            if [ "$CODE" -eq 200 ]; then
              echo ">>> Found at: $path"
              echo "Package declaration:"
              curl -sL "$URL" | base64 -d 2>/dev/null | head -n 15 | grep "package "
            fi
          done

      - name: Probe Native Scene Layer and Title Cache in M153
        run: |
          set +e
          echo "=========================================================="
          echo "### Probing Scene Layer & Title Cache APIs in M153 ###"
          echo "=========================================================="

          TARGETS=(
            "chrome/android/java/src/org/chromium/chrome/browser/compositor/LayerTitleCache.java"
            "chrome/android/java/src/org/chromium/chrome/browser/compositor/scene_layer/TabStripSceneLayer.java"
            "chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.h"
            "chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.cc"
          )

          for path in "${TARGETS[@]}"; do
            URL="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${path}?format=TEXT"
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            echo "HTTP $CODE -> $path"
          done

      - name: Fetch Custom Requested File (if provided)
        if: "${{ github.event.inputs.custom_file_path != '' }}"
        run: |
          set +e
          FILE="${{ github.event.inputs.custom_file_path }}"
          URL="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${FILE}?format=TEXT"
          
          echo "Fetching $URL ..."
          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o response.txt "$URL")
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "=========================================================="
            echo "### Content of $FILE ###"
            echo "=========================================================="
            base64 -d response.txt
          else
            echo "Failed to retrieve $FILE (HTTP $HTTP_STATUS)"
          fi
