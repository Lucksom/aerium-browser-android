name: Inspect Layout Contract

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Fetch and inspect key files on demand
        working-directory: chromium-src
        run: |
          set +e
          show() {
            echo "===== $1 ====="
            git show "$VERSION:$1" 2>/dev/null || echo "!!! could not fetch $1"
          }

          echo "### Layout.java: how does it wire up a scene layer? ###"
          show chrome/browser/ui/android/layouts/java/src/org/chromium/chrome/browser/layouts/Layout.java \
            | grep -n -B2 -A5 -i "scenelayer\|getSceneLayer"

          echo
          echo "### EventFilter.java: current touch-callback contract ###"
          show chrome/browser/ui/android/layouts/java/src/org/chromium/chrome/browser/layouts/EventFilter.java \
            | grep -n -B1 -A3 "void \|boolean \|interface \|abstract "

          echo
          echo "### Any class still implementing pinch/fling/onLongPress-style callbacks? ###"
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          grep -E "layouts/.*\.java$" /tmp/all_paths.txt | while read -r f; do
            content=$(git show "$VERSION:$f" 2>/dev/null)
            if echo "$content" | grep -q "onPinch\|onLongPress.*float.*float"; then
              echo "MATCH: $f"
            fi
          done
