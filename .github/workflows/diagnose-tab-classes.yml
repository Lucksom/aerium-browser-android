name: Fetch Specific Files Directly

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Set Chromium Version
        run: |
          VERSION="153.0.8010.36"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target Chromium Version: $VERSION"

      - name: Fetch and Dump LayoutManagerChromePhone.java
        run: |
          set -e
          URL="https://chromium.googlesource.com/chromium/src/+/${VERSION}/chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutManagerChromePhone.java?format=TEXT"
          
          echo "Fetching from $URL..."
          curl -sL "$URL" | base64 -d > LayoutManagerChromePhone.java

          echo "=========================================================="
          echo "### LayoutManagerChromePhone.java Content ###"
          echo "=========================================================="
          cat LayoutManagerChromePhone.java

      - name: Test Interpolators.java Location
        run: |
          set +e
          echo "Testing location 1 (ui/interpolators)..."
          HTTP_CODE_1=$(curl -s -o /dev/null -w "%{http_code}" "https://chromium.googlesource.com/chromium/src/+/${VERSION}/ui/android/java/src/org/chromium/ui/interpolators/Interpolators.java?format=TEXT")
          echo "ui/interpolators: HTTP $HTTP_CODE_1"

          echo "Testing location 2 (components/browser_ui/widget/animation)..."
          HTTP_CODE_2=$(curl -s -o /dev/null -w "%{http_code}" "https://chromium.googlesource.com/chromium/src/+/${VERSION}/components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/animation/Interpolators.java?format=TEXT")
          echo "components/browser_ui: HTTP $HTTP_CODE_2"
