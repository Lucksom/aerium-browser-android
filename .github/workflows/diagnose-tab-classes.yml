name: Inspect Motion Event Classes

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Show full content of the two renamed gesture classes
        working-directory: chromium-src
        run: |
          set +e
          echo "===== MotionEventHandler.java (likely renamed GestureHandler) ====="
          git show "$VERSION:chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/eventfilter/MotionEventHandler.java"

          echo
          echo "===== MotionEventFilter.java (likely renamed GestureEventFilter) ====="
          git show "$VERSION:chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/eventfilter/MotionEventFilter.java"

      - name: Structural re-search for a TabListSceneLayer equivalent
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          echo "### Any file extending SceneLayer with 'Tab' in its name or content? ###"
          grep -E "\.java$" /tmp/all_paths.txt | grep -i "scenelayer" | while read -r f; do
            echo "--- $f ---"
            git show "$VERSION:$f" 2>/dev/null | grep -n "extends SceneLayer\|class .*SceneLayer" | head -3
          done
