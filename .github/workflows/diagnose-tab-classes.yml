name: Inspect Tab Strip Scene Layer (multi-tab template)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Show tab_strip_scene_layer.h and .cc in full
        working-directory: chromium-src
        run: |
          set +e
          echo "===== chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.h ====="
          git show "$VERSION:chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.h"
          echo
          echo "===== chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.cc ====="
          git show "$VERSION:chrome/browser/android/compositor/scene_layer/tab_strip_scene_layer.cc"

      - name: Show its Java counterpart for the full add/remove/update API shape
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          f=$(grep -E "TabStripSceneLayer\.java$" /tmp/all_paths.txt | head -1)
          echo "===== $f ====="
          git show "$VERSION:$f" 2>/dev/null
