name: Inspect TabListCoordinator

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved Chromium version: $VERSION"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Locate the real TabListCoordinator.java path
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          echo "### All matches for TabListCoordinator.java ###"
          grep -E "TabListCoordinator\.java$" /tmp/all_paths.txt

      - name: Fetch the real file and grep the exact lines this patch depends on
        working-directory: chromium-src
        run: |
          set +e
          f=$(grep -E "TabListCoordinator\.java$" /tmp/all_paths.txt | head -1)
          echo "Using: $f"
          git show "$VERSION:$f" > /tmp/TabListCoordinator.java 2>/dev/null

          echo
          echo "### setDefaultGridCardSize call sites (with context) ###"
          grep -n -B3 -A1 "setDefaultGridCardSize" /tmp/TabListCoordinator.java

          echo
          echo "### setLayoutManager call sites (with context) ###"
          grep -n -B3 -A1 "setLayoutManager" /tmp/TabListCoordinator.java

          echo
          echo "### layoutType / TabListLayoutType.GROUPED logic ###"
          grep -n -B2 -A2 "TabListLayoutType.GROUPED\|TabListLayoutType.FLAT" /tmp/TabListCoordinator.java

          echo
          echo "### GridLayoutManager references ###"
          grep -n "GridLayoutManager" /tmp/TabListCoordinator.java

      - name: Show full file content
        working-directory: chromium-src
        run: |
          echo "===== FULL TabListCoordinator.java ====="
          cat /tmp/TabListCoordinator.java
