name: Inspect Target Files for Classic Stack

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Inspect Target Files
        run: |
          set +e
          VERSION="153.0.8010.36"

          # Helper function: tries GitHub Raw CDN first, falls back to Gitiles
          fetch_raw() {
            local file_path="$1"
            local out_name="$2"

            local gh_url="https://raw.githubusercontent.com/chromium/chromium/${VERSION}/${file_path}"
            local status=$(curl -sL -w "%{http_code}" -o "$out_name" "$gh_url")

            if [ "$status" -eq 200 ] && [ -s "$out_name" ]; then
              echo ">>> Fetched $out_name via GitHub Raw"
              return 0
            fi

            sleep 1
            local gitiles_url="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${file_path}?format=TEXT"
            status=$(curl -sL -A "Mozilla/5.0" -w "%{http_code}" -o b64.tmp "$gitiles_url")
            if [ "$status" -eq 200 ]; then
              base64 -d b64.tmp > "$out_name" 2>/dev/null
              if [ -s "$out_name" ]; then
                echo ">>> Fetched $out_name via Gitiles"
                rm -f b64.tmp
                return 0
              fi
            fi

            echo "[ERROR] Could not fetch $file_path (HTTP $status)"
            rm -f b64.tmp
            return 1
          }

          echo "=========================================================="
          echo "### 1. Inspecting TabsSettings.java (Full Content) ###"
          echo "=========================================================="
          fetch_raw "chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/TabsSettings.java" "TabsSettings.java"
          if [ -s TabsSettings.java ]; then
            nl -ba TabsSettings.java
          fi

          echo
          echo "=========================================================="
          echo "### 2. Inspecting TabUiFeatureUtilities.java (Tail & Structure) ###"
          echo "=========================================================="
          fetch_raw "chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/TabUiFeatureUtilities.java" "TabUiFeatureUtilities.java"
          if [ -s TabUiFeatureUtilities.java ]; then
            echo "--- Last 40 lines of TabUiFeatureUtilities.java ---"
            tail -n 40 TabUiFeatureUtilities.java | nl -ba
          fi
