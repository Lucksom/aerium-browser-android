name: Inspect M153 APIs Part 3

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Remaining APIs
        run: |
          set +e
          VERSION="153.0.8010.36"

          fetch_raw() {
            local file_path="$1"
            local out_name="$2"

            local gh_url="https://raw.githubusercontent.com/chromium/chromium/${VERSION}/${file_path}"
            local status=$(curl -sL -w "%{http_code}" -o "$out_name" "$gh_url")
            
            if [ "$status" -eq 200 ] && [ -s "$out_name" ]; then
              echo ">>> [SUCCESS] Fetched $out_name"
              return 0
            fi

            sleep 1
            local gitiles_url="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${file_path}?format=TEXT"
            status=$(curl -sL -A "Mozilla/5.0" -w "%{http_code}" -o b64.tmp "$gitiles_url")
            if [ "$status" -eq 200 ]; then
              base64 -d b64.tmp > "$out_name" 2>/dev/null
              if [ -s "$out_name" ]; then
                echo ">>> [SUCCESS] Fetched $out_name via Gitiles"
                rm -f b64.tmp
                return 0
              fi
            fi

            echo "[ERROR] Could not fetch $file_path (HTTP $status)"
            rm -f b64.tmp
            return 1
          }

          echo "=========================================================="
          echo "### 1. Locate TabListCoordinator patch in repository ###"
          echo "=========================================================="
          grep -rn "TabListCoordinator" . || echo "[NONE] TabListCoordinator not found in workspace"

          echo
          echo "=========================================================="
          echo "### 2. TabThemeColorHelper.java ###"
          echo "=========================================================="
          fetch_raw "chrome/android/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java" "TabThemeColorHelper.java"
          if [ -s TabThemeColorHelper.java ]; then
            grep -n -C 4 "getBackgroundColor" TabThemeColorHelper.java
          fi

          echo
          echo "=========================================================="
          echo "### 3. TabRemover.java (Tab Closure Signatures) ###"
          echo "=========================================================="
          fetch_raw "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabRemover.java" "TabRemover.java"
          if [ -s TabRemover.java ]; then
            nl -ba TabRemover.java
          fi

          echo
          echo "=========================================================="
          echo "### 4. TabList.java (Index & Retrieval Signatures) ###"
          echo "=========================================================="
          fetch_raw "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabList.java" "TabList.java"
          if [ -s TabList.java ]; then
            grep -n "public" TabList.java
          fi

          echo
          echo "=========================================================="
          echo "### 5. TabModelSelector.java (Full Interface) ###"
          echo "=========================================================="
          fetch_raw "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabModelSelector.java" "TabModelSelector.java"
          if [ -s TabModelSelector.java ]; then
            nl -ba TabModelSelector.java
          fi
