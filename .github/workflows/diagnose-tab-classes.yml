name: Inspect Native Scene Layer

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: List all native scene_layer files and check for any multi-tab (vector-based) ones
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt

          echo "### All native scene_layer .cc/.h files ###"
          grep -E "scene_layer.*\.(cc|h)$" /tmp/all_paths.txt

          echo
          echo "### Does any of them manage a vector/list of tabs? ###"
          grep -E "scene_layer.*\.(cc|h)$" /tmp/all_paths.txt | while read -r f; do
            hit=$(git show "$VERSION:$f" 2>/dev/null | grep -c "std::vector.*[Tt]ab\|std::vector.*[Ll]ayer")
            if [ "$hit" -gt 0 ]; then
              echo "CANDIDATE (vector-based): $f"
            fi
          done

      - name: Show static_tab_scene_layer.cc and .h in full
        working-directory: chromium-src
        run: |
          set +e
          for ext in cc h; do
            f=$(grep -E "static_tab_scene_layer\.${ext}$" /tmp/all_paths.txt 2>/dev/null)
            [ -z "$f" ] && f=$(git ls-tree -r --name-only "$VERSION" | grep -E "static_tab_scene_layer\.${ext}$")
            echo "===== $f ====="
            git show "$VERSION:$f" 2>/dev/null
          done
