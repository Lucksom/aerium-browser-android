name: Inspect Final API Details

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect theme.sh and Helper Classes
        run: |
          set +e
          VERSION="153.0.8010.36"

          echo "=========================================================="
          echo "### 1. theme.sh lines 5660 to 5720 (TabListCoordinator injection) ###"
          echo "=========================================================="
          sed -n '5660,5720p' theme.sh | nl -ba -v 5660

          echo
          echo "=========================================================="
          echo "### 2. TabThemeColorHelper.java (Full Content) ###"
          echo "=========================================================="
          curl -sL "https://raw.githubusercontent.com/chromium/chromium/${VERSION}/chrome/android/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java" -o TabThemeColorHelper.java
          if [ -s TabThemeColorHelper.java ]; then
            nl -ba TabThemeColorHelper.java
          else
            echo "[ERROR] Could not fetch TabThemeColorHelper.java"
          fi

          echo
          echo "=========================================================="
          echo "### 3. StackLayoutBase.java observer lines (patches/classic_stack) ###"
          echo "=========================================================="
          if [ -f patches/classic_stack/StackLayoutBase.java ]; then
            sed -n '415,465p' patches/classic_stack/StackLayoutBase.java | nl -ba -v 415
          fi
