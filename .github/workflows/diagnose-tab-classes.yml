name: Diagnose Tab Classes

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved Chromium version: $VERSION"

      - name: Partial clone (tree metadata only, no blobs)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src
          cd chromium-src
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt
          wc -l /tmp/all_paths.txt

      - name: Search for tab classes across entire tree
        run: |
          CLASSES=(
            TabContentManager SceneLayer TabListSceneLayer CompositorAnimator
            FloatProperty EventFilter GestureEventFilter GestureHandler
            LayoutManager
          )
          echo "=========================================================="
          for cls in "${CLASSES[@]}"; do
            matches=$(grep -E "/${cls}\.java$" /tmp/all_paths.txt)
            if [ -n "$matches" ]; then
              echo "FOUND: $cls"
              echo "$matches" | sed 's/^/    -> /'
            else
              echo "NOT_FOUND (exact): $cls -- trying fuzzy match..."
              fuzzy=$(grep -iE "${cls}" /tmp/all_paths.txt | grep '\.java$' | head -5)
              if [ -n "$fuzzy" ]; then
                echo "  possible renames/relocations:"
                echo "$fuzzy" | sed 's/^/    ? /'
              else
                echo "  NOTHING MATCHING '$cls' ANYWHERE IN THE TREE -- likely deleted"
              fi
            fi
          done
