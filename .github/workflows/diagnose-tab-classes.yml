name: Inspect LayoutManager and Interpolators

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium Version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target Chromium Version: $VERSION"

      - name: Sparse Clone and Inspect Layout Components
        run: |
          set -e

          # 1. Initialize clone with sparse checkout
          git clone --filter=blob:none --sparse --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src
          
          cd chromium-src

          # 2. Define all target directories upfront in one batch
          git sparse-checkout set \
            chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts \
            chrome/android/java/src/org/chromium/chrome/browser/hub \
            components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/animation \
            ui/android/java/src/org/chromium/ui/interpolators

          # 3. Check out target ref with all blobs retrieved
          git checkout "$VERSION"

          echo "=========================================================="
          echo "### 1. LOCATE INTERPOLATORS IN M153 ###"
          echo "=========================================================="
          find . -name "Interpolators.java"

          echo
          echo "=========================================================="
          echo "### 2. LOCATE LAYOUT MANAGERS ###"
          echo "=========================================================="
          find chrome/android -name "*LayoutManager*.java"

          echo
          echo "=========================================================="
          echo "### 3. DUMP LayoutManagerChromePhone.java ###"
          echo "=========================================================="
          LM_PHONE="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutManagerChromePhone.java"
          if [ -f "$LM_PHONE" ]; then
            cat "$LM_PHONE"
          else
            echo "[ERROR] Could not find $LM_PHONE"
          fi
