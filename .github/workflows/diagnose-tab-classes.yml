name: Inspect M153 APIs Part 4

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Final APIs and theme.sh
        run: |
          set +e
          VERSION="153.0.8010.36"

          fetch_raw() {
            local file_path="$1"
            local out_name="$2"

            local gh_url="https://raw.githubusercontent.com/chromium/chromium/${VERSION}/${file_path}"
            local status=$(curl -sL -w "%{http_code}" -o "$out_name" "$gh_url")
            
            if [ "$status" -eq 200 ] && [ -s "$out_name" ]; then
              echo ">>> [SUCCESS] Fetched $out_name"
              return 0
            fi

            sleep 1
            local gitiles_url="https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${file_path}?format=TEXT"
            status=$(curl -sL -A "Mozilla/5.0" -w "%{http_code}" -o b64.tmp "$gitiles_url")
            if [ "$status" -eq 200 ]; then
              base64 -d b64.tmp > "$out_name" 2>/dev/null
              if [ -s "$out_name" ]; then
                echo ">>> [SUCCESS] Fetched $out_name via Gitiles"
                rm -f b64.tmp
                return 0
              fi
            fi

            echo "[ERROR] Could not fetch $file_path (HTTP $status)"
            rm -f b64.tmp
            return 1
          }

          echo "=========================================================="
          echo "### 1. Inspect theme.sh around line 5635 (TabListCoordinator injection) ###"
          echo "=========================================================="
          sed -n '5620,5660p' theme.sh | nl -ba -v 5620

          echo
          echo "=========================================================="
          echo "### 2. TabClosureParams.java (Full Content) ###"
          echo "=========================================================="
          fetch_raw "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabClosureParams.java" "TabClosureParams.java"
          if [ -s TabClosureParams.java ]; then
            grep -n -E "public static|closeTab|closeAllTabs|allowUndo|build" TabClosureParams.java
          fi

          echo
          echo "=========================================================="
          echo "### 3. TabList.java (Full Interface) ###"
          echo "=========================================================="
          fetch_raw "chrome/browser/tabmodel/android/java/src/org/chromium/chrome/browser/tabmodel/TabList.java" "TabList.java"
          if [ -s TabList.java ]; then
            nl -ba TabList.java
          fi

          echo
          echo "=========================================================="
          echo "### 4. TabThemeColorHelper.java (Full Methods) ###"
          echo "=========================================================="
          fetch_raw "chrome/android/java/src/org/chromium/chrome/browser/tab/TabThemeColorHelper.java" "TabThemeColorHelper.java"
          if [ -s TabThemeColorHelper.java ]; then
            grep -n "public static" TabThemeColorHelper.java
          fi

          echo
          echo "=========================================================="
          echo "### 5. Layout.java (Tab Callbacks & NextTabId) ###"
          echo "=========================================================="
          fetch_raw "chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/Layout.java" "Layout.java"
          if [ -s Layout.java ]; then
            echo "--- Grep for Tab event hooks in Layout.java ---"
            grep -n -E "onTab|tabSelected|tabClosing|mNextTabId" Layout.java || echo "[NONE] No legacy tab hooks in Layout.java"
          fi
