name: Inspect Layout Contract v2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone + one sparse-checkout of the layouts module
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src
          cd chromium-src
          git sparse-checkout set \
            chrome/browser/ui/android/layouts \
            chrome/browser/compositor
          git checkout "$VERSION"

      - name: Find surviving Layout subclasses with gesture/drag behavior
        working-directory: chromium-src
        run: |
          set +e
          echo "### Layout subclasses still in the tree ###"
          grep -rl "extends Layout\b" --include=*.java . 2>/dev/null

          echo
          echo "### Classes extending EventFilter (current gesture pattern) ###"
          grep -rl "extends EventFilter\b" --include=*.java . 2>/dev/null

          echo
          echo "### GestureDetector / ScaleGestureDetector usage anywhere here ###"
          grep -rln "GestureDetector\|ScaleGestureDetector" --include=*.java . 2>/dev/null

          echo
          echo "### Any SceneOverlay-based rendering (Android-View-backed overlay) ###"
          grep -rln "SceneOverlay\b" --include=*.java . 2>/dev/null

          echo
          echo "### Layout.java: does it expose getSceneOverlays() or similar? ###"
          grep -n "SceneOverlay\|abstract.*View\|getViewport\|attachViews" \
            chrome/browser/ui/android/layouts/java/src/org/chromium/chrome/browser/layouts/Layout.java

      - name: Show a full candidate file for reference (first match found)
        working-directory: chromium-src
        run: |
          set +e
          f=$(grep -rl "extends Layout\b" --include=*.java . 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            echo "### Full content of candidate: $f ###"
            cat "$f"
          else
            echo "No surviving Layout subclass found in fetched dirs -- widen sparse-checkout"
          fi
