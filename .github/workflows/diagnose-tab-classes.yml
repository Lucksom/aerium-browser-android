name: Fetch Specific Files Directly

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium Version from repository
        run: |
          # Dynamically search for args.gn across the repo and submodules
          ARGS_FILE=$(find . -name "args.gn" | head -n 1)
          if [ -n "$ARGS_FILE" ] && [ -f "$ARGS_FILE" ]; then
            echo "[aerium] Found args file at: $ARGS_FILE"
            VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' "$ARGS_FILE" || true)
          fi

          if [ -z "$VERSION" ]; then
            echo "[aerium] Fallback to provided version"
            VERSION="153.0.8010.36"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target Chromium Version: $VERSION"

      - name: Fetch and Dump LayoutManagerChromePhone.java
        run: |
          set +e
          FILE_PATH="chrome/android/java/src/org/chromium/chrome/browser/compositor/layouts/LayoutManagerChromePhone.java"

          # Candidate URL formats on Google Gitiles
          URLS=(
            "https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${FILE_PATH}?format=TEXT"
            "https://chromium.googlesource.com/chromium/src/+/${VERSION}/${FILE_PATH}?format=TEXT"
            "https://chromium.googlesource.com/chromium/src/+/main/${FILE_PATH}?format=TEXT"
          )

          FETCHED=0
          for url in "${URLS[@]}"; do
            echo "Trying $url ..."
            HTTP_STATUS=$(curl -sL -w "%{http_code}" -o raw_response.txt "$url")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              base64 -d raw_response.txt > LayoutManagerChromePhone.java 2>/dev/null
              if [ -s LayoutManagerChromePhone.java ]; then
                echo "Successfully fetched and decoded LayoutManagerChromePhone.java!"
                FETCHED=1
                break
              fi
            fi
          done

          if [ "$FETCHED" -eq 1 ]; then
            echo "=========================================================="
            echo "### LayoutManagerChromePhone.java Content ###"
            echo "=========================================================="
            cat LayoutManagerChromePhone.java
          else
            echo "[ERROR] Failed to fetch via Gitiles. Response preview:"
            head -n 20 raw_response.txt
            echo
            echo "--- Checking available remote tags for ${VERSION} ---"
            git ls-remote --tags https://chromium.googlesource.com/chromium/src.git "*${VERSION}*" | head -10
          fi

      - name: Test Interpolators.java Location
        run: |
          set +e
          LOCATIONS=(
            "ui/android/java/src/org/chromium/ui/interpolators/Interpolators.java"
            "components/browser_ui/widget/android/java/src/org/chromium/components/browser_ui/widget/animation/Interpolators.java"
          )

          for loc in "${LOCATIONS[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://chromium.googlesource.com/chromium/src/+/refs/tags/${VERSION}/${loc}?format=TEXT")
            if [ "$CODE" -ne 200 ]; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://chromium.googlesource.com/chromium/src/+/${VERSION}/${loc}?format=TEXT")
            fi
            echo "$loc: HTTP $CODE"
          done
