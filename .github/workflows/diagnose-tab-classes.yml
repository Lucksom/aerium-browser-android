name: Inspect ScrollDirection and GN target for Layout files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve Chromium version
        run: |
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Partial clone (tree metadata only)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "$VERSION" \
            https://chromium.googlesource.com/chromium/src.git chromium-src

      - name: Structurally search for ScrollDirection everywhere
        working-directory: chromium-src
        run: |
          set +e
          git ls-tree -r --name-only "$VERSION" > /tmp/all_paths.txt

          echo "### Any file literally named ScrollDirection.java? ###"
          grep -iE "scrolldirection\.java$" /tmp/all_paths.txt

          echo
          echo "### Any Java file that DEFINES an interface/enum called ScrollDirection ###"
          grep -E "\.java$" /tmp/all_paths.txt | while read -r f; do
            hit=$(git show "$VERSION:$f" 2>/dev/null | grep -c "interface ScrollDirection\|enum ScrollDirection")
            if [ "$hit" -gt 0 ]; then
              echo "DEFINED IN: $f"
              git show "$VERSION:$f" 2>/dev/null | grep -n -B2 -A8 "interface ScrollDirection\|enum ScrollDirection"
            fi
          done

          echo
          echo "### Every file that still IMPORTS some ScrollDirection (any package) ###"
          grep -E "\.java$" /tmp/all_paths.txt | while read -r f; do
            hit=$(git show "$VERSION:$f" 2>/dev/null | grep -c "import.*ScrollDirection;")
            if [ "$hit" -gt 0 ]; then
              git show "$VERSION:$f" 2>/dev/null | grep -n "import.*ScrollDirection;" | sed "s|^|$f: |"
            fi
          done

      - name: Find the GN target that lists Layout.java as a source, and its deps
        working-directory: chromium-src
        run: |
          set +e
          echo "### Every BUILD.gn under compositor/layouts that mentions Layout.java ###"
          grep -E "compositor/layouts.*BUILD\.gn$|compositor/layouts.*\.gni$" /tmp/all_paths.txt

          for f in $(grep -E "chrome/android.*\.gni$|chrome/android/BUILD\.gn$" /tmp/all_paths.txt); do
            content=$(git show "$VERSION:$f" 2>/dev/null)
            if echo "$content" | grep -q "compositor/layouts/phone/Layout.java\|LayoutManagerChromePhone.java"; then
              echo "===== FOUND SOURCES LIST IN: $f ====="
              echo "$content" | grep -n -B2 -A2 "compositor/layouts/phone/Layout.java\|LayoutManagerChromePhone.java"
              echo
              echo "### deps block in this same file (does it already reference supplier_java?) ###"
              echo "$content" | grep -n -A3 "deps = \[\|deps += \[" | head -60
              echo "$content" | grep -n "supplier_java\|base:supplier"
            fi
          done
